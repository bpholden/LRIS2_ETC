# Example configuration for lris2-etc:  lris2-etc -c example_config.ini
# Keys are the long command line option names; any option given on the
# command line overrides the value here. Leave a key out to use the default.

[lris2-etc]
mag = 22
filter = sdss_rprime
template = starb1
redshift = 0
time = 1200
airmass = 1.2
seeing = 1.0
beta = 3
slit_width = 0.7
slit_length = 8
blue_grism = B600
red_grism = R400
per_angstrom = false
flux_plots = false
# extraction length in units of the seeing FWHM; leave out to sum the full slit
# aperture = 1.5
